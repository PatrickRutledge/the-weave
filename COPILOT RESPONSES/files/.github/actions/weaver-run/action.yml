name: "Weaver Run"
description: "Run the-weave analysis and create issues"
inputs:
  create_issues:
    required: false
    default: "true"
  add_to_project:
    required: false
    default: "false"
runs:
  using: "composite"
  steps:
    - uses: actions/setup-node@v4
      with:
        node-version: 20
    - run: npx -y the-weave@latest review --repo-path . --out weaver-report.json --format json --cache-dir .weaver-cache
      shell: bash
    - uses: actions/upload-artifact@v4
      with:
        name: weaver-report
        path: weaver-report.json
    - if: ${{ inputs.create_issues == 'true' }}
      uses: actions/github-script@v7
      with:
        script: |
          const fs = require('fs');
          const lessons = JSON.parse(fs.readFileSync('weaver-report.json', 'utf8'));
          for (const [i, l] of lessons.entries()) {
            const issue = await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: l.title || `Weaver Lesson ${i+1}`,
              body: l.description || '',
              labels: l.labels || ['weaver','lessons-learned']
            });
            core.info(`Created #${issue.data.number}`);
          }