name: Weaver Review

on:
  pull_request:
    types: [closed]
  workflow_dispatch:
    inputs:
      base:
        description: "Base SHA (optional for manual runs)"
        required: false
        type: string
      head:
        description: "Head SHA (optional for manual runs)"
        required: false
        type: string
      create_issues:
        description: "Create issues from lessons"
        required: false
        type: boolean
        default: true
      add_to_project:
        description: "Add created issues to Project V2 by ID (requires WEAVER_PROJECT_ID secret)"
        required: false
        type: boolean
        default: false
  repository_dispatch:
    types: [weaver-review]

permissions:
  contents: read
  issues: write
  pull-requests: read

jobs:
  weaver:
    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'repository_dispatch' ||
      (github.event_name == 'pull_request' && github.event.pull_request.merged == true)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      # Optional: Provide a cache dir for incremental analyses
      WEAVER_CACHE_DIR: .weaver-cache
      # Optional: Pass a project ID via repo/org secret for Projects v2
      WEAVER_PROJECT_ID: ${{ secrets.WEAVER_PROJECT_ID }}
      # Controls issue creation at runtime
      CREATE_ISSUES: ${{ inputs.create_issues || 'true' }}
      ADD_TO_PROJECT: ${{ inputs.add_to_project || 'false' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine base/head SHAs
        id: shas
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "base=${{ github.event.pull_request.base.sha }}" >> $GITHUB_OUTPUT
            echo "head=${{ github.event.pull_request.merge_commit_sha }}" >> $GITHUB_OUTPUT
          elif [ "${{ github.event_name }}" = "repository_dispatch" ]; then
            echo "base=${{ github.event.client_payload.base || '' }}" >> $GITHUB_OUTPUT
            echo "head=${{ github.event.client_payload.head || '' }}" >> $GITHUB_OUTPUT
          else
            # workflow_dispatch
            echo "base=${{ inputs.base }}" >> $GITHUB_OUTPUT
            echo "head=${{ inputs.head }}" >> $GITHUB_OUTPUT
          fi

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Restore Weaver cache
        uses: actions/cache@v4
        with:
          path: .weaver-cache
          key: weaver-${{ runner.os }}-${{ github.repository }}-${{ steps.shas.outputs.base || 'none' }}-${{ steps.shas.outputs.head || github.sha }}

      - name: Run Weaver analysis
        run: |
          # Prefer using the published CLI; replace 'the-weave' with your package name if different
          npx -y the-weave@latest review \
            --repo-path . \
            $( [ -n "${{ steps.shas.outputs.base }}" ] && echo --base ${{ steps.shas.outputs.base }} ) \
            $( [ -n "${{ steps.shas.outputs.head }}" ] && echo --head ${{ steps.shas.outputs.head }} ) \
            --out weaver-report.json \
            --format json \
            --cache-dir "${WEAVER_CACHE_DIR}"

      - name: Upload report artifact
        uses: actions/upload-artifact@v4
        with:
          name: weaver-report
          path: weaver-report.json
          if-no-files-found: error
          retention-days: 14

      - name: Create issues from lessons (optional)
        if: env.CREATE_ISSUES == 'true'
        uses: actions/github-script@v7
        env:
          ADD_TO_PROJECT: ${{ env.ADD_TO_PROJECT }}
          WEAVER_PROJECT_ID: ${{ env.WEAVER_PROJECT_ID }}
        with:
          script: |
            const fs = require('fs');
            if (!fs.existsSync('weaver-report.json')) {
              core.setFailed('weaver-report.json not found');
              return;
            }
            const lessons = JSON.parse(fs.readFileSync('weaver-report.json', 'utf8'));
            if (!Array.isArray(lessons)) {
              core.setFailed('weaver-report.json must be an array of lessons');
              return;
            }

            const createdIssues = [];
            for (const [i, lesson] of lessons.entries()) {
              const title = lesson.title || `Weaver Lesson ${i+1}`;
              const bodyLines = [];
              if (lesson.description) bodyLines.push(lesson.description);
              if (lesson.evidence) bodyLines.push(`\nEvidence:\n${lesson.evidence}`);
              if (lesson.references && lesson.references.length) {
                bodyLines.push('\nReferences:');
                for (const ref of lesson.references) bodyLines.push(`- ${ref}`);
              }
              if (lesson.patterns && lesson.patterns.length) {
                bodyLines.push('\nDetected Patterns:');
                for (const p of lesson.patterns) bodyLines.push(`- ${p}`);
              }
              if (lesson.recommended_actions && lesson.recommended_actions.length) {
                bodyLines.push('\nRecommended Actions:');
                for (const a of lesson.recommended_actions) bodyLines.push(`- ${a}`);
              }
              const labels = Array.isArray(lesson.labels) ? lesson.labels : ['weaver', 'lessons-learned'];

              const issue = await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body: bodyLines.join('\n'),
                labels,
              });
              createdIssues.push(issue.data);

              // Optionally add to Projects v2
              if (process.env.ADD_TO_PROJECT === 'true' && process.env.WEAVER_PROJECT_ID) {
                const issueNodeId = issue.data.node_id;
                await github.graphql(`
                  mutation AddToProject($projectId: ID!, $contentId: ID!) {
                    addProjectV2ItemById(input: {projectId: $projectId, contentId: $contentId}) {
                      item { id }
                    }
                  }
                `, {
                  projectId: process.env.WEAVER_PROJECT_ID,
                  contentId: issueNodeId
                });
              }
            }
            core.summary
              .addHeading('Weaver: Created Issues')
              .addRaw(createdIssues.map(i => `- #${i.number} ${i.title}`).join('\n'))
              .write();